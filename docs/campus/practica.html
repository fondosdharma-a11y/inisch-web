<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica — Campus INISCH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="css/campus.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/campus-core.js"></script>
<script>

var TIPOS = {
  atencion_fina: { t:"Atención Fina", ic:"◉",
    d:"Involucra un solo sentido a la vez. Observa el objeto, luego el tacto, luego el olfato, luego el gusto." },
  meditacion:    { t:"Meditación", ic:"◎",
    d:"Calma la mente. Se sugiere música de cuencos tibetanos, agua fluyendo o frecuencias de 432 Hz o 528 Hz." },
  silencio:      { t:"Silencio", ic:"○",
    d:"No es ausencia de ruido: es un estado interior donde la mente se aquieta y el Ser puede expresarse." },
  perdon:        { t:"Auténtico Perdón", ic:"✦",
    d:"Imagina la infancia de quien te causó dolor hasta que aparezca la compasión." }
};
var SENTIDOS = ["vista","tacto","olfato","gusto","oído"];

Campus.boot("Práctica", function(c, u){
  var E = Campus.esc;

  var head = document.createElement("div");
  head.className = "reveal";
  head.innerHTML =
    '<div class="eyebrow">Herramienta</div>' +
    '<h1 style="font-size:clamp(26px,4vw,36px);line-height:1.12">Mi práctica</h1>' +
    '<p class="muted" style="margin-top:10px;max-width:620px">' +
      'La comprensión sin práctica se queda en idea. Aquí registras lo que sostienes día con día.</p>';
  c.appendChild(head);

  var timer = document.createElement("div");
  timer.className = "card reveal";
  timer.style.margin = "24px 0";
  timer.innerHTML =
    '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:space-between">' +
      '<div><b>Temporizador</b>' +
        '<p class="muted tiny" style="margin-top:4px">Elige los minutos, practica, y al terminar registra lo observado.</p>' +
        '<div class="chips" id="tm-min" style="margin-top:14px">' +
          '<button class="chip" data-m="3">3 min</button>' +
          '<button class="chip on" data-m="5">5 min</button>' +
          '<button class="chip" data-m="10">10 min</button>' +
          '<button class="chip" data-m="20">20 min</button>' +
        '</div></div>' +
      '<div style="text-align:center">' +
        '<div id="tm-disp" style="font-family:\'Space Grotesk\',sans-serif;font-size:46px;line-height:1;font-weight:600">05:00</div>' +
        '<div style="display:flex;gap:8px;margin-top:14px">' +
          '<button class="btn-p btn-sm" id="tm-go">Comenzar</button>' +
          '<button class="btn-o btn-sm" id="tm-rst">Reiniciar</button>' +
        '</div></div>' +
    '</div>';
  c.appendChild(timer);

  var mins = 5, left = 300, running = false, tick = null;
  var disp = timer.querySelector("#tm-disp");
  function paint(){
    var m = Math.floor(left/60), s = left%60;
    disp.textContent = (m<10?"0":"")+m + ":" + (s<10?"0":"")+s;
  }
  timer.querySelectorAll("#tm-min .chip").forEach(function(b){
    b.addEventListener("click", function(){
      if (running) return;
      timer.querySelectorAll("#tm-min .chip").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      mins = parseInt(b.dataset.m,10); left = mins*60; paint();
    });
  });
  timer.querySelector("#tm-go").addEventListener("click", function(){
    var btn = this;
    if (running){ clearInterval(tick); running=false; btn.textContent="Continuar"; return; }
    running = true; btn.textContent = "Pausar";
    tick = setInterval(function(){
      left--; paint();
      if (left <= 0){
        clearInterval(tick); running=false; btn.textContent="Comenzar";
        left = mins*60; paint();
        Campus.toast("Práctica completada · " + mins + " minutos");
        editor({ minutos: mins });
      }
    }, 1000);
  });
  timer.querySelector("#tm-rst").addEventListener("click", function(){
    clearInterval(tick); running=false;
    timer.querySelector("#tm-go").textContent = "Comenzar";
    left = mins*60; paint();
  });
  paint();

  var acciones = document.createElement("div");
  acciones.className = "reveal";
  acciones.style.marginBottom = "22px";
  acciones.innerHTML = '<button class="btn-o" id="pr-new">+ Registrar práctica manualmente</button>';
  c.appendChild(acciones);
  acciones.querySelector("#pr-new").addEventListener("click", function(){ editor({}); });

  var zone = document.createElement("div");
  zone.innerHTML = '<div class="card"><p class="muted tiny">Cargando tu práctica…</p></div>';
  c.appendChild(zone);

  function render(){
    Campus.DB.list("practicas", { order:"fecha", desc:true }).then(function(rows){
      rows = rows || [];
      var h = "";
      var totalMin = 0, dias = {};
      rows.forEach(function(r){
        totalMin += (parseInt(r.minutos,10) || 0);
        if (r.fecha) dias[String(r.fecha).slice(0,10)] = true;
      });
      var racha = 0, d = new Date();
      for (var i=0;i<400;i++){
        var key = d.toISOString().slice(0,10);
        if (dias[key]) { racha++; d.setDate(d.getDate()-1); }
        else if (i===0){ d.setDate(d.getDate()-1); }
        else break;
      }

      h += '<div class="grid-3 reveal" style="margin-bottom:26px">';
      h += stat("◉", rows.length, rows.length===1?"práctica":"prácticas");
      h += stat("⏱", totalMin, "minutos en total");
      h += stat("✦", racha, racha===1?"día seguido":"días seguidos");
      h += '</div>';

      h += '<div class="card reveal" style="margin-bottom:26px"><b>Últimas cuatro semanas</b>';
      h += '<div class="heat" style="margin-top:16px">';
      var t = new Date(), cells = [];
      for (var k=27;k>=0;k--){
        var dd = new Date(t); dd.setDate(t.getDate()-k);
        var key2 = dd.toISOString().slice(0,10);
        cells.push('<span class="hc' + (dias[key2] ? " on" : "") + '" title="' + key2 + '"></span>');
      }
      h += cells.join("") + '</div>';
      h += '<p class="muted tiny" style="margin-top:12px">Cada cuadro es un día. Los dorados son días en que practicaste.</p></div>';

      if (!rows.length){
        h += '<div class="card reveal" style="text-align:center;padding:42px 24px">' +
             '<div style="font-size:34px;opacity:.5;margin-bottom:12px">◎</div>' +
             '<b>Todavía no has registrado práctica</b>' +
             '<p class="muted" style="margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto;font-size:15px">' +
             'Usa el temporizador de arriba. Cinco minutos al día sostenidos valen más que una hora una vez al mes.</p></div>';
      } else {
        h += '<h2 style="font-size:19px;margin:0 0 14px">Historial</h2>';
        rows.forEach(function(r){
          var T = TIPOS[r.tipo] || { t:r.tipo, ic:"◇" };
          h += '<div class="card reveal" style="margin-bottom:12px">';
          h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">';
          h += '<div style="flex:1"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
               '<span style="font-size:17px;opacity:.8">' + T.ic + '</span>' +
               '<b style="font-size:15px">' + E(T.t) + '</b>' +
               (r.minutos ? '<span class="chip on tiny">' + r.minutos + ' min</span>' : '') +
               (r.sentido ? '<span class="chip tiny">' + E(r.sentido) + '</span>' : '') + '</div>' +
               '<p class="tiny soft" style="margin-top:7px">' + E(String(r.fecha||"").slice(0,10)) + '</p>' +
               (r.observacion ? '<p class="muted" style="margin-top:9px;font-size:15px">' + E(r.observacion) + '</p>' : '') +
               '</div>';
          h += '<button class="btn-o btn-sm pr-del" data-id="' + r.id + '">✕</button></div></div>';
        });
      }
      zone.innerHTML = h;
      Campus.reveal(c);
      zone.querySelectorAll(".pr-del").forEach(function(b){
        b.addEventListener("click", function(){
          if (!confirm("¿Eliminar este registro?")) return;
          Campus.DB.remove("practicas", b.dataset.id).then(function(){ Campus.toast("Registro eliminado"); render(); });
        });
      });
    }).catch(function(e){
      console.error(e);
      zone.innerHTML = '<div class="card"><p class="muted">No pudimos cargar tu práctica. ' +
        'Si acabas de conectar Supabase, revisa que hayas ejecutado <code>schema-v2.sql</code>.</p></div>';
    });
  }

  function stat(ic, n, unit){
    return '<div class="card" style="text-align:center">' +
      '<div style="font-size:22px;opacity:.85;margin-bottom:8px">' + ic + '</div>' +
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:30px;font-weight:600;line-height:1">' + n + '</div>' +
      '<div class="tiny soft" style="margin-top:4px">' + unit + '</div></div>';
  }

  function editor(rec){
    var back = document.createElement("div"); back.className="sheet-back";
    var sh = document.createElement("div");   sh.className="sheet";
    var hoy = new Date().toISOString().slice(0,10);

    var h = '<div class="sheet-head"><div><div class="eyebrow">Práctica</div>' +
      '<h2 style="font-size:22px;margin-top:4px">Registrar práctica</h2></div>' +
      '<button class="btn-o btn-sm sh-x">Cerrar</button></div>';
    h += '<div class="sheet-body">';
    h += '<label class="fl">¿Qué practicaste?</label><div class="chips" id="p-tipo">';
    Object.keys(TIPOS).forEach(function(k, i){
      h += '<button type="button" class="chip' + (i===0?" on":"") + '" data-v="' + k + '">' +
           TIPOS[k].ic + ' ' + E(TIPOS[k].t) + '</button>';
    });
    h += '</div><p class="muted tiny" id="p-desc" style="margin-top:9px">' + E(TIPOS.atencion_fina.d) + '</p>';
    h += '<div id="p-sent-wrap"><label class="fl" style="margin-top:18px">¿Con qué sentido trabajaste?</label>' +
         '<div class="chips" id="p-sent">';
    SENTIDOS.forEach(function(s){ h += '<button type="button" class="chip" data-v="' + s + '">' + E(s) + '</button>'; });
    h += '</div></div>';
    h += '<label class="fl" style="margin-top:18px">Minutos</label>' +
         '<input class="fi" type="number" id="p-min" min="1" max="600" value="' + (rec.minutos||5) + '">';
    h += '<label class="fl" style="margin-top:18px">Fecha</label>' +
         '<input class="fi" type="date" id="p-fecha" value="' + hoy + '">';
    h += '<label class="fl" style="margin-top:18px">¿Qué observaste?</label>' +
         '<textarea class="fi ft" id="p-obs" rows="4" placeholder="Sin buscar un resultado. Solo lo que notaste: en el cuerpo, en la mente, en la respiración."></textarea>';
    h += '</div>';
    h += '<div class="sheet-foot"><span class="tiny soft"></span>' +
         '<button class="btn-p btn-sm sh-save">Guardar</button></div>';

    sh.innerHTML = h;
    document.body.appendChild(back); document.body.appendChild(sh);
    requestAnimationFrame(function(){ back.classList.add("on"); sh.classList.add("on"); });

    var tipo = "atencion_fina", sentido = null;
    function syncSent(){
      sh.querySelector("#p-sent-wrap").style.display = (tipo==="atencion_fina") ? "" : "none";
    }
    sh.querySelectorAll("#p-tipo .chip").forEach(function(b){
      b.addEventListener("click", function(){
        sh.querySelectorAll("#p-tipo .chip").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on"); tipo = b.dataset.v;
        sh.querySelector("#p-desc").textContent = TIPOS[tipo].d;
        syncSent();
      });
    });
    sh.querySelectorAll("#p-sent .chip").forEach(function(b){
      b.addEventListener("click", function(){
        sh.querySelectorAll("#p-sent .chip").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on"); sentido = b.dataset.v;
      });
    });
    syncSent();

    function close(){
      back.classList.remove("on"); sh.classList.remove("on");
      setTimeout(function(){ back.remove(); sh.remove(); }, 260);
    }
    sh.querySelector(".sh-x").addEventListener("click", close);
    back.addEventListener("click", close);
    sh.querySelector(".sh-save").addEventListener("click", function(){
      var row = {
        tipo: tipo,
        minutos: parseInt(sh.querySelector("#p-min").value,10) || null,
        sentido: (tipo==="atencion_fina") ? sentido : null,
        fecha: sh.querySelector("#p-fecha").value || hoy,
        observacion: sh.querySelector("#p-obs").value.trim()
      };
      Campus.DB.save("practicas", row).then(function(){
        Campus.toast("Práctica registrada"); close(); render();
      }).catch(function(e){ console.error(e); Campus.toast("No se pudo guardar."); });
    });
  }

  render();
});

</script>
</body>
</html>
