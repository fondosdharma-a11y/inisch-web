<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lección — Campus INISCH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/campus.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/campus-core.js"></script>
<script>

Campus.boot("Lección", function(c, u){
  var E = Campus.esc;
  var idPedida = Campus.param("id");

  var zona = document.createElement("div");
  zona.innerHTML = '<div class="card"><p class="muted tiny">Cargando la lección…</p></div>';
  c.appendChild(zona);

  /* Convierte cualquier enlace de YouTube o Vimeo en uno incrustable */
  function incrustar(url, seg){
    if (!url) return null;
    var m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);
    if (m) return "https://www.youtube.com/embed/" + m[1] +
      "?rel=0&modestbranding=1&enablejsapi=1" + (seg ? "&start=" + Math.floor(seg) : "");
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return "https://player.vimeo.com/video/" + m[1] + (seg ? "#t=" + Math.floor(seg) + "s" : "");
    return url;
  }
  function mmss(s){
    s = Math.floor(s||0);
    var m = Math.floor(s/60), r = s%60;
    return m + ":" + (r<10?"0":"") + r;
  }

  Campus.todas([Campus.DB.catalog(), Campus.DB.progress(),
                Campus.DB.list("notas_leccion",{}), Campus.DB.list("video_progreso",{})])
  .then(function(res){
    var cursos = res[0]||[], prog = res[1]||[], notas = res[2]||[], vids = res[3]||[];
    var todas = [];
    cursos.forEach(function(co){ (co.lessons||[]).forEach(function(l){ l._curso = co; todas.push(l); }); });

    if (!todas.length){
      zona.innerHTML = '<div class="card" style="text-align:center;padding:44px 24px">' +
        '<b>Todavía no tienes lecciones</b><p class="muted" style="margin-top:8px;font-size:15px">' +
        'Cuando se active tu inscripción aparecerán aquí.</p>' +
        '<a class="btn-o btn-sm" style="margin-top:18px" href="dashboard.html">Volver al inicio</a></div>';
      return;
    }

    var hechas = {}; prog.forEach(function(p){ hechas[p.lesson_id] = true; });
    var nota   = {}; notas.forEach(function(n){ nota[n.lesson_id] = n; });
    var vpos   = {}; vids.forEach(function(v){ vpos[v.lesson_id] = v; });

    var i = 0;
    if (idPedida){
      var k = todas.map(function(l){ return String(l.id); }).indexOf(String(idPedida));
      if (k >= 0) i = k;
    } else {
      var pend = todas.map(function(l,ix){ return hechas[l.id] ? -1 : ix; }).filter(function(x){ return x>=0; });
      if (pend.length) i = pend[0];
    }
    pintar(i);

    function pintar(idx){
      var l = todas[idx];
      var hecha = !!hechas[l.id];
      var vp = vpos[l.id];
      var reanudarDesde = (vp && vp.segundos > 20 && (!vp.duracion || vp.segundos < vp.duracion - 25)) ? vp.segundos : 0;

      var h = '<div class="lec-cols">';

      /* ---- columna principal ---- */
      h += '<div>';
      h += '<div class="eyebrow">' + E(l._curso.title || "") + '</div>';
      h += '<h1 style="font-size:clamp(23px,3.4vw,31px);line-height:1.15;margin:6px 0 18px">' + E(l.title) + '</h1>';

      if (reanudarDesde){
        h += '<div class="reanudar"><span>▶</span><div style="flex:1">Te quedaste en <b>' + mmss(reanudarDesde) + '</b></div>' +
             '<button class="btn-o btn-sm" id="v-desde-cero">Empezar de cero</button></div>';
      }

      h += '<div class="video-wrap" id="v-caja"></div>';

      if (l.content) h += '<p class="muted" style="margin-top:18px;font-size:15.5px">' + E(l.content) + '</p>';

      h += '<div class="lec-nav">';
      h += idx > 0
        ? '<button class="btn-o btn-sm" id="v-prev">‹ Anterior</button>'
        : '<span></span>';
      h += '<button class="' + (hecha ? "btn-o" : "btn-p") + ' btn-sm" id="v-check">' +
           (hecha ? "✓ Completada" : "Marcar como completada") + '</button>';
      h += idx < todas.length-1
        ? '<button class="btn-p btn-sm" id="v-next">Siguiente ›</button>'
        : '<a class="btn-p btn-sm" href="certificados.html">Ver mis logros ›</a>';
      h += '</div>';

      /* ---- apuntes ---- */
      h += '<div class="card" style="margin-top:26px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">';
      h += '<b>Mis apuntes de esta lección</b><span class="tiny soft" id="n-st"></span></div>';
      h += '<p class="muted tiny" style="margin:7px 0 12px">Privado. Solo tú puedes verlo. Se guarda solo.</p>';
      h += '<textarea class="fld fld-t" id="n-txt" rows="7" placeholder="¿Qué te resonó? ¿Qué se movió? ¿Qué quieres recordar?">' +
           E((nota[l.id]||{}).contenido || "") + '</textarea>';
      h += '</div>';
      h += '</div>';

      /* ---- columna lateral: el temario ---- */
      h += '<div class="card lec-lista"><b style="display:block;margin-bottom:12px">Temario</b>';
      todas.forEach(function(x, ix){
        h += '<a href="#" data-ix="' + ix + '" class="' + (ix===idx?"on ":"") + (hechas[x.id]?"hecha":"") + '">' +
             '<span class="n">' + (hechas[x.id] ? "✓" : (ix+1)) + '</span>' +
             '<span style="flex:1">' + E(x.title) + '</span></a>';
      });
      var nd = todas.filter(function(x){ return hechas[x.id]; }).length;
      h += '<div class="bar" style="margin-top:14px"><i style="width:' + Math.round(nd/todas.length*100) + '%"></i></div>';
      h += '<p class="tiny soft" style="margin-top:8px">' + nd + ' de ' + todas.length + ' completadas</p>';
      h += '</div>';

      h += '</div>';
      zona.innerHTML = h;

      /* ---- video ---- */
      var caja = document.getElementById("v-caja");
      var src = incrustar(l.video_url, reanudarDesde);
      if (src){
        caja.innerHTML = '<iframe src="' + E(src) + '" allow="accelerated-destination; autoplay; encrypted-media; picture-in-picture" allowfullscreen title="' + E(l.title) + '"></iframe>';
        empezarConteo(l.id, reanudarDesde);
      } else {
        caja.innerHTML = '<div class="video-vacio"><div style="font-size:30px;opacity:.5">▶</div>' +
          '<b>El video de esta lección aún no está disponible</b>' +
          '<p class="tiny soft">En cuanto se publique aparecerá aquí. Mientras tanto puedes leer la descripción y tomar apuntes.</p></div>';
      }

      var cero = document.getElementById("v-desde-cero");
      if (cero) cero.addEventListener("click", function(){
        Campus.DB.save("video_progreso", { id:(vp||{}).id, lesson_id:l.id, segundos:0 })
          .then(function(){ vpos[l.id] = { lesson_id:l.id, segundos:0 }; pintar(idx); });
      });

      /* ---- navegacion ---- */
      var p = document.getElementById("v-prev"), n = document.getElementById("v-next");
      if (p) p.addEventListener("click", function(){ ir(idx-1); });
      if (n) n.addEventListener("click", function(){ ir(idx+1); });
      zona.querySelectorAll(".lec-lista a").forEach(function(a){
        a.addEventListener("click", function(e){ e.preventDefault(); ir(parseInt(a.dataset.ix,10)); });
      });
      function ir(k){
        guardarNota(true);
        history.replaceState(null,"","leccion.html?id=" + encodeURIComponent(todas[k].id));
        pintar(k);
        window.scrollTo({top:0, behavior:"smooth"});
      }

      /* ---- completar ---- */
      document.getElementById("v-check").addEventListener("click", function(){
        var era = !!hechas[l.id];
        Campus.DB.toggleProgress(l.id, !era).then(function(){
          hechas[l.id] = !era;
          Campus.toast(era ? "Marcada como pendiente" : "¡Lección completada!");
          if (!era && idx < todas.length-1) ir(idx+1); else pintar(idx);
        }).catch(function(){ Campus.toast("No se pudo guardar."); });
      });

      /* ---- apuntes con autoguardado ---- */
      var ta = document.getElementById("n-txt"), st = document.getElementById("n-st"), tmr=null, sucio=false;
      ta.addEventListener("input", function(){
        sucio = true; st.textContent = "Escribiendo…";
        clearTimeout(tmr); tmr = setTimeout(function(){ guardarNota(false); }, 1200);
      });
      function guardarNota(silencio){
        if (!sucio) return;
        var row = { lesson_id:l.id, contenido: ta.value };
        if (nota[l.id] && nota[l.id].id) row.id = nota[l.id].id;
        if (!silencio) st.textContent = "Guardando…";
        Campus.DB.save("notas_leccion", row).then(function(s){
          nota[l.id] = s || row; sucio = false;
          if (!silencio) st.textContent = "Guardado ✓";
        }).catch(function(){ if(!silencio) st.textContent = "No se pudo guardar"; });
      }
      window.addEventListener("beforeunload", function(){ guardarNota(true); });
    }

    /* ---- conteo del tiempo de video ----
       Los reproductores incrustados no siempre permiten leer el minuto exacto
       sin su API. Llevamos un conteo propio del tiempo en pantalla, que es
       suficiente para ofrecer "continuar donde quedaste". */
    var reloj = null;
    function empezarConteo(lessonId, desde){
      if (reloj) clearInterval(reloj);
      var seg = desde || 0, ultimo = 0;
      reloj = setInterval(function(){
        if (document.hidden) return;
        seg += 5;
        if (seg - ultimo >= 15){
          ultimo = seg;
          var prev = vpos[lessonId] || {};
          Campus.DB.save("video_progreso", { id:prev.id, lesson_id:lessonId, segundos:seg })
            .then(function(s){ if (s) vpos[lessonId] = s; })
            .catch(function(){});
        }
      }, 5000);
    }
  })
  .catch(function(e){
    console.error(e);
    zona.innerHTML = '<div class="card"><p class="muted">No pudimos cargar la lección. Intenta recargar la página.</p></div>';
  });
});

</script>
<script src="js/instalar.js"></script>
</body>
</html>
