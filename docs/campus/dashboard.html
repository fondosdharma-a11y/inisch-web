<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — Campus INISCH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1518">
<link rel="stylesheet" href="css/campus.css">

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/campus-core.js"></script>
<script>

Campus.boot("Inicio", function(c, u){
  var E = Campus.esc;
  var saludo = (function(){
    var h = new Date().getHours();
    if (h < 12) return "Buenos días";
    if (h < 19) return "Buenas tardes";
    return "Buenas noches";
  })();
  var nombre = (u.full_name||"").split(" ")[0] || "";

  var head = document.createElement("div");
  head.className = "reveal";
  head.style.marginBottom = "26px";
  head.innerHTML =
    '<div class="eyebrow">Tu proceso</div>' +
    '<h1 style="font-size:clamp(27px,4vw,38px);line-height:1.1">' + saludo + (nombre ? ", " + E(nombre) : "") + '</h1>' +
    '<p class="muted" style="margin-top:8px">Este es tu espacio. Avanza a tu ritmo.</p>';
  c.appendChild(head);

  var zone = document.createElement("div");
  zone.innerHTML = '<div class="card"><p class="muted tiny">Cargando tu avance…</p></div>';
  c.appendChild(zone);

  Campus.todas([Campus.DB.catalog(), Campus.DB.progress(),
               Campus.DB.list("bitacora",{order:"fecha",desc:true}),
               Campus.DB.list("mi_pelicula",{}),
               Campus.DB.list("practicas",{order:"fecha",desc:true})])
  .then(function(res){
    var courses = res[0]||[], prog = res[1]||[], bit = res[2]||[], pel = res[3]||[], pra = res[4]||[];
    var doneIds = {}; prog.forEach(function(p){ doneIds[p.lesson_id]=1; });

    var all = []; courses.forEach(function(co){ (co.lessons||[]).forEach(function(l){ all.push(l); }); });
    var total = all.length, done = all.filter(function(l){ return doneIds[l.id]; }).length;
    var pct = total ? (done/total)*100 : 0;
    var next = all.filter(function(l){ return !doneIds[l.id]; })[0];

    // racha de practica (dias consecutivos)
    var racha = (function(){
      if (!pra.length) return 0;
      var set = {}; pra.forEach(function(p){ set[p.fecha]=1; });
      var n=0, d=new Date();
      for(;;){
        var k = d.toISOString().slice(0,10);
        if (set[k]) { n++; d.setDate(d.getDate()-1); }
        else if (n===0){ d.setDate(d.getDate()-1); if(!set[d.toISOString().slice(0,10)]) break; }
        else break;
        if (n>400) break;
      }
      return n;
    })();

    var h = '';

    // --- Aviso amable si lleva dias sin practicar (nunca culpabiliza) ---
    (function(){
      if (!pra.length) return;                    // aun no empieza: no lo presionamos
      var ult = pra.map(function(p){ return String(p.fecha||"").slice(0,10); }).sort().pop();
      if (!ult) return;
      var dias = Math.round((new Date().setHours(0,0,0,0) - new Date(ult+"T00:00:00")) / 86400000);
      if (dias < 3 || dias > 120) return;
      h += '<div class="nudge reveal"><span class="n-ic">◉</span>' +
           '<div class="n-txt">Han pasado ' + dias + ' días desde tu última práctica. ' +
           'No pasa nada: el proceso no es lineal. Cinco minutos bastan para retomarlo.</div>' +
           '<a class="btn-o btn-sm" href="practica.html">Practicar ahora</a></div>';
    })();

    // --- Continuar donde quedaste ---
    h += '<div class="card reveal" style="margin-bottom:18px">';
    h += '<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">';
    h += Campus.ring(pct, "avance");
    h += '<div style="flex:1;min-width:220px">';
    if (next){
      h += '<div class="eyebrow">Continúa donde quedaste</div>';
      h += '<h2 style="font-size:20px;margin-bottom:6px">' + E(next.title) + '</h2>';
      h += '<p class="muted tiny" style="margin-bottom:16px">' + E((next.content||"").slice(0,140)) + '</p>';
      h += '<a class="btn" href="leccion.html' + (next ? '?id=' + encodeURIComponent(next.id) : '') + '">Continuar lección ›</a>';
    } else if (total) {
      h += '<div class="eyebrow">Completado</div>';
      h += '<h2 style="font-size:20px;margin-bottom:6px">Terminaste todas tus lecciones</h2>';
      h += '<p class="muted tiny" style="margin-bottom:16px">Puedes descargar tu constancia o repasar cuando quieras.</p>';
      h += '<a class="btn" href="certificados.html">Ver mis certificados ›</a>';
    } else {
      h += '<div class="eyebrow">Sin lecciones aún</div>';
      h += '<h2 style="font-size:20px;margin-bottom:6px">Tu contenido aparecerá aquí</h2>';
      h += '<p class="muted tiny">En cuanto se active tu inscripción verás tus lecciones.</p>';
    }
    h += '</div></div>';
    h += '<div style="margin-top:20px"><div class="bar"><i style="width:' + pct + '%"></i></div>';
    h += '<p class="tiny soft" style="margin-top:8px">' + done + ' de ' + total + ' lecciones completadas</p></div>';
    h += '</div>';

    // --- Tres indicadores ---
    h += '<div class="grid g3 reveal" style="margin-bottom:18px">';
    h += tile("🎥","Mi Película", pel.length, pel.length===1?"registro":"registros", "mi-pelicula.html");
    h += tile("✎","Bitácora", bit.length, bit.length===1?"entrada":"entradas", "bitacora.html");
    h += tile("◉","Práctica", racha, racha===1?"día seguido":"días seguidos", "practica.html");
    h += '</div>';

    // --- Lecciones ---
    if (total){
      h += '<div class="card reveal" style="margin-bottom:18px">';
      h += '<div class="card-h"><h3>Tus lecciones</h3><a class="tiny" style="color:var(--gold)" href="lecciones.html">Ver todas ›</a></div>';
      all.slice(0,4).forEach(function(l,i){
        var d = !!doneIds[l.id];
        h += '<a class="lesson' + (d?" done":"") + '" href="leccion.html?id=' + encodeURIComponent(l.id) + '">';
        h += '<div class="num">' + (d ? "✓" : (i+1)) + '</div>';
        h += '<div class="lt"><b>' + E(l.title) + '</b><span>' + (d?"Completada":"Pendiente") + '</span></div>';
        h += '<span class="soft">›</span></a>';
      });
      h += '</div>';
    }

    // --- Sugerencia del dia ---
    var tips = [
      ["Observa sin corregir","Hoy, cada vez que notes que quieres controlar algo, solo obsérvalo. No hagas nada más. Darte cuenta ya es el trabajo."],
      ["Una expectativa menos","Identifica una expectativa que traes puesta sobre alguien. Escríbela en tu Bitácora y pregúntate de dónde viene."],
      ["Atención Fina al comer","En tu próxima comida usa un sentido a la vez: primero mira, luego toca, luego huele, y al final saborea."],
      ["El personaje de hoy","¿Quién de tu presente está interpretando un personaje de tu infancia? Anótalo en Mi Película."],
      ["Tres respiraciones","Antes de responder algo que te moleste hoy, haz tres respiraciones conscientes. Nada más."],
      ["Imagina su infancia","Piensa en alguien que te incomodó esta semana e imagina cómo fue su niñez. Observa qué se mueve."],
      ["El silencio","Busca cinco minutos de silencio real hoy. Sin teléfono, sin música. Solo estar."]
    ];
    var tip = tips[new Date().getDay() % tips.length];
    h += '<div class="card reveal" style="border-color:rgba(216,180,90,.4)">';
    h += '<div class="eyebrow">Práctica sugerida de hoy</div>';
    h += '<h3 style="font-size:19px;margin-bottom:8px">' + E(tip[0]) + '</h3>';
    h += '<p class="muted" style="font-size:15px">' + E(tip[1]) + '</p>';
    h += '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">';
    h += '<a class="btn-o btn-sm" href="bitacora.html">Anotar en Bitácora</a>';
    h += '<a class="btn-o btn-sm" href="practica.html">Registrar práctica</a>';
    h += '</div></div>';

    zone.innerHTML = h;
    Campus.reveal(c);
  })
  .catch(function(e){
    console.error(e);
    zone.innerHTML = '<div class="card"><p class="muted">No pudimos cargar tu avance. ' +
      'Si acabas de conectar Supabase, revisa que hayas ejecutado <code>schema.sql</code> y <code>schema-v2.sql</code>.</p></div>';
  });

  function tile(ic, label, n, unit, href){
    return '<a class="card" href="' + href + '" style="text-align:center;display:block">' +
      '<div style="font-size:24px;margin-bottom:8px;opacity:.85">' + ic + '</div>' +
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:31px;font-weight:600;line-height:1">' + n + '</div>' +
      '<div class="tiny soft" style="margin-top:3px">' + unit + '</div>' +
      '<div class="tiny" style="margin-top:10px;color:var(--gold)">' + label + ' ›</div></a>';
  }
});

</script>
<script src="js/instalar.js"></script>
</body>
</html>
