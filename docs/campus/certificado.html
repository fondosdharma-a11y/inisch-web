<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constancia — Campus INISCH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/campus.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/campus-core.js"></script>
<script>

Campus.boot("Certificado", function(c, u){
  var E = Campus.esc;
  var folioPedido = Campus.param("folio");

  var barra = document.createElement("div");
  barra.className = "no-print";
  barra.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center";
  barra.innerHTML =
    '<button class="btn-p btn-sm" id="imprimir">Guardar como PDF o imprimir</button>' +
    '<a class="btn-o btn-sm" href="certificados.html">Volver</a>' +
    '<span class="tiny soft" style="flex:1;min-width:230px">Elige orientación <b>horizontal</b> para mejor resultado.</span>';
  c.appendChild(barra);

  var zona = document.createElement("div");
  zona.innerHTML = '<div class="card"><p class="muted tiny">Cargando…</p></div>';
  c.appendChild(zona);
  document.getElementById("imprimir").addEventListener("click", function(){ window.print(); });

  var ETAPA = {
    1: "Taller Intensivo del Sistema Código Holográfico",
    2: "Diplomado y Certificación de Especialista en Autoconocimiento del SCH",
    3: "Certificación como Instructor del SCH"
  };
  var HORAS = { 1:"16 horas", 2:"128 horas", 3:"120 horas" };

  function traer(){
    if (Campus.DEMO) return Promise.resolve([]);
    return supabaseClient.from("certificates").select("*").eq("student_id", u.id)
      .then(function(r){ if(r.error) throw r.error; return r.data||[]; });
  }
  function nombreImpreso(){
    if (Campus.DEMO) {
      try { return (JSON.parse(localStorage.getItem("inisch-demo:perfil")||"{}").nombre_certificado) || u.full_name; }
      catch(e){ return u.full_name; }
    }
    return supabaseClient.from("profiles").select("nombre_certificado, full_name").eq("id", u.id).single()
      .then(function(r){ return (r.data && (r.data.nombre_certificado || r.data.full_name)) || u.full_name; })
      .catch(function(){ return u.full_name; });
  }

  Promise.all([traer(), nombreImpreso()]).then(function(res){
    var certs = res[0] || [], nombre = res[1] || u.full_name;
    var cert = folioPedido ? certs.filter(function(x){ return x.folio === folioPedido; })[0] : certs[0];

    if (!cert){
      zona.innerHTML = '<div class="card" style="text-align:center;padding:44px 24px">' +
        '<div style="font-size:32px;opacity:.5;margin-bottom:12px">✦</div>' +
        '<b>Todavía no tienes constancias emitidas</b>' +
        '<p class="muted" style="margin-top:8px;max-width:460px;margin-left:auto;margin-right:auto;font-size:15px">' +
        'El Instituto emite tu constancia al concluir satisfactoriamente una etapa. ' +
        'Cuando esté lista aparecerá aquí para descargarla.</p>' +
        '<a class="btn-o btn-sm" style="margin-top:18px" href="certificados.html">Ver mis logros</a></div>';
      return;
    }

    var h = '<div class="cert">';
    h += '<img class="cert-mandala" src="../assets/mandala.png" alt="">';
    h += '<h1>Constancia de Formación</h1>';
    h += '<div class="c-sub">Instituto Internacional del Sistema Código Holográfico</div>';
    h += '<p class="c-txt">Se hace constar que</p>';
    h += '<div class="c-nombre">' + E(cert.nombre_impreso || nombre) + '</div>';
    h += '<p class="c-txt">concluyó satisfactoriamente la formación correspondiente a la ' +
         '<b>' + E(ETAPA[cert.etapa] || ("Programa " + cert.etapa)) + '</b>, ' +
         'con una carga de ' + E(HORAS[cert.etapa] || "") + ' bajo la metodología del Sistema Código Holográfico ' +
         'creada por Isabel Elizalde.</p>';
    h += '<div class="c-pie">';
    h += '<div style="text-align:left"><div class="c-folio">Folio: ' + E(cert.folio) + '</div>' +
         '<div>Emitida el ' + E(Campus.fechaLarga(cert.issued_at)) + '</div></div>';
    h += '<div style="text-align:right">Instituto Internacional del<br>Sistema Código Holográfico</div>';
    h += '</div></div>';

    h += '<p class="tiny soft no-print" style="text-align:center;margin-top:22px;max-width:620px;margin-left:auto;margin-right:auto">' +
         'Esta constancia acredita la formación impartida por el Instituto. ' +
         'La certificación oficial SEP-CONOCER (EC1375) es un proceso independiente que emite el organismo certificador ' +
         'y se consulta directamente en el RENAP.</p>';
    zona.innerHTML = h;
  }).catch(function(e){
    console.error(e);
    zona.innerHTML = '<div class="card"><p class="muted">No pudimos cargar tu constancia.</p></div>';
  });
});

</script>
<script src="js/instalar.js"></script>
</body>
</html>
